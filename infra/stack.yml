# Stack Swarm `sejaengajado` — single-node Hostinger.
# Traefik v3.5.3 na rede TarcisoDevNet; certresolver `cfdns` (DNS Cloudflare).
# `letsencryptresolver` (HTTP challenge) NÃO é usado neste stack.
# Postgres: banco `sejaengajado` no Supabase self-hosted (host Docker `supabase_supabase_db`
# na rede TarcisoDevNet — sem rede overlay separada).
# Sem Redis (⏳P11). Sem valores de segredo — só nomes external.
# Deploy na VPS: Tarciso/Atlas. Validar: docker stack config -c infra/stack.yml
# Env do deploy (obrigatórios onde marcado): IMAGE_TAG, BACKUP_TAG, S3_ENDPOINT;
# opcional: ASAAS_BASE_URL (default sandbox), SUPABASE_ANON_KEY.

version: "3.8"

x-deploy-common: &deploy_common
  # `any`: volta após restart do Docker (on-failure não volta).
  restart_policy: { condition: any, delay: 5s, window: 120s }
  update_config:
    {
      parallelism: 1,
      order: start-first,
      failure_action: rollback,
      monitor: 45s,
      delay: 5s,
    }
  rollback_config: { parallelism: 1, order: start-first, failure_action: pause, monitor: 30s }
  placement: { constraints: [node.role == manager] }

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  web-ssr:
    image: ghcr.io/tarcisodev/sejaengajado-web:${IMAGE_TAG:?IMAGE_TAG required}
    environment:
      NODE_ENV: production
      PORT: "4000"
      API_INTERNAL_URL: http://api:3000
      API_PUBLIC_URL: /api
      NODE_OPTIONS: --max-old-space-size=192
      SUPABASE_URL: https://supabase.tarciso.dev
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SENTRY_DSN_FILE: /run/secrets/se_sentry_dsn
      SENTRY_RELEASE: ${IMAGE_TAG:?IMAGE_TAG required}
    secrets: [se_sentry_dsn]
    networks: [TarcisoDevNet, se_internal]
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      <<: *deploy_common
      replicas: 1
      resources:
        reservations: { memory: 96M }
        limits: { memory: 256M, cpus: "0.50" }
      labels:
        - traefik.enable=true
        - traefik.swarm.network=TarcisoDevNet
        - traefik.http.routers.se-web.rule=Host(`sejaengajado.com.br`) || Host(`app.sejaengajado.com.br`) || HostRegexp(`^[a-z0-9-]+\\.sejaengajado\\.com\\.br$$`)
        - traefik.http.routers.se-web.priority=1
        - traefik.http.routers.se-web.entrypoints=websecure
        - traefik.http.routers.se-web.tls.certresolver=cfdns
        - traefik.http.routers.se-web.tls.domains[0].main=sejaengajado.com.br
        - traefik.http.routers.se-web.tls.domains[0].sans=*.sejaengajado.com.br
        - traefik.http.routers.se-web.middlewares=se-headers,se-ratelimit
        - traefik.http.services.se-web.loadbalancer.server.port=4000
        - traefik.http.services.se-web.loadbalancer.healthcheck.path=/healthz
        # HSTS + headers (compartilhados com se-app*)
        - traefik.http.middlewares.se-headers.headers.stsSeconds=31536000
        - traefik.http.middlewares.se-headers.headers.stsIncludeSubdomains=true
        - traefik.http.middlewares.se-headers.headers.contentTypeNosniff=true
        - traefik.http.middlewares.se-headers.headers.frameDeny=true
        - traefik.http.middlewares.se-headers.headers.referrerPolicy=strict-origin-when-cross-origin
        - traefik.http.middlewares.se-ratelimit.ratelimit.average=50
        - traefik.http.middlewares.se-ratelimit.ratelimit.burst=100
        - traefik.http.middlewares.se-ratelimit.ratelimit.period=1s

  api:
    image: ghcr.io/tarcisodev/sejaengajado-api:${IMAGE_TAG:?IMAGE_TAG required}
    environment:
      NODE_ENV: production
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=256
      DATABASE_URL_FILE: /run/secrets/se_database_url
      ADMIN_DATABASE_URL_FILE: /run/secrets/se_admin_database_url
      SUPABASE_URL: https://supabase.tarciso.dev
      SUPABASE_JWT_AUD: authenticated
      SUPABASE_JWT_SECRET_FILE: /run/secrets/se_supabase_jwt_secret
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/se_supabase_service_role_key
      # Sandbox por padrão; produção: ASAAS_BASE_URL=https://api.asaas.com/v3 no deploy.
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://sandbox.asaas.com/api/v3}
      ASAAS_API_KEY_FILE: /run/secrets/se_asaas_api_key
      ASAAS_WEBHOOK_TOKEN_FILE: /run/secrets/se_asaas_webhook_token
      # Conta R2: https://<ACCOUNT_ID>.r2.cloudflarestorage.com (env do deploy).
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT required}
      S3_REGION: auto
      S3_BUCKET: se-uploads
      S3_BACKUP_BUCKET: se-backup
      S3_ACCESS_KEY_FILE: /run/secrets/se_s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/se_s3_secret_key
      SMTP_URL_FILE: /run/secrets/se_smtp_url
      HC_JOBS_URL_FILE: /run/secrets/se_hc_jobs_url
      SENTRY_DSN_FILE: /run/secrets/se_sentry_dsn
      SENTRY_RELEASE: ${IMAGE_TAG:?IMAGE_TAG required}
      ENABLE_DOCS: "false"
    secrets:
      - se_database_url
      - se_admin_database_url
      - se_supabase_jwt_secret
      - se_supabase_service_role_key
      - se_asaas_api_key
      - se_asaas_webhook_token
      - se_s3_access_key
      - se_s3_secret_key
      - se_smtp_url
      - se_hc_jobs_url
      - se_sentry_dsn
    # DB via supabase_supabase_db na TarcisoDevNet (sem supabase_network).
    networks: [TarcisoDevNet, se_internal]
    logging: *logging
    healthcheck:
      # Liveness — readiness (DB+R2) fica no Traefik LB abaixo.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      <<: *deploy_common
      replicas: 1
      resources:
        reservations: { memory: 128M }
        limits: { memory: 320M, cpus: "0.75" }
      labels:
        - traefik.enable=true
        - traefik.swarm.network=TarcisoDevNet
        # Rate-limit mais forte em webhooks e auth (prioridade > se-app).
        - traefik.http.middlewares.se-ratelimit-strict.ratelimit.average=10
        - traefik.http.middlewares.se-ratelimit-strict.ratelimit.burst=20
        - traefik.http.middlewares.se-ratelimit-strict.ratelimit.period=1s
        - traefik.http.routers.se-app-webhooks.rule=Host(`app.sejaengajado.com.br`) && PathPrefix(`/api/webhooks`)
        - traefik.http.routers.se-app-webhooks.priority=300
        - traefik.http.routers.se-app-webhooks.entrypoints=websecure
        - traefik.http.routers.se-app-webhooks.tls.certresolver=cfdns
        - traefik.http.routers.se-app-webhooks.middlewares=se-headers,se-ratelimit-strict
        - traefik.http.routers.se-app-webhooks.service=se-app
        - traefik.http.routers.se-app-auth.rule=Host(`app.sejaengajado.com.br`) && (PathPrefix(`/api/auth`) || PathPrefix(`/api/admin/auth`))
        - traefik.http.routers.se-app-auth.priority=290
        - traefik.http.routers.se-app-auth.entrypoints=websecure
        - traefik.http.routers.se-app-auth.tls.certresolver=cfdns
        - traefik.http.routers.se-app-auth.middlewares=se-headers,se-ratelimit-strict
        - traefik.http.routers.se-app-auth.service=se-app
        # API sob app./api (sem host api.) — prioridade acima do se-web.
        - traefik.http.routers.se-app.rule=Host(`app.sejaengajado.com.br`) && PathPrefix(`/api`)
        - traefik.http.routers.se-app.priority=200
        - traefik.http.routers.se-app.entrypoints=websecure
        - traefik.http.routers.se-app.tls.certresolver=cfdns
        - traefik.http.routers.se-app.middlewares=se-headers,se-ratelimit
        - traefik.http.services.se-app.loadbalancer.server.port=3000
        - traefik.http.services.se-app.loadbalancer.healthcheck.path=/api/health/ready

  migrate:
    image: ghcr.io/tarcisodev/sejaengajado-api:${IMAGE_TAG:?IMAGE_TAG required}
    command:
      [
        "sh",
        "-c",
        "export DATABASE_URL=$$(tr -d '\\r\\n' < /run/secrets/se_admin_database_url) && npx prisma migrate deploy",
      ]
    secrets: [se_admin_database_url]
    networks: [TarcisoDevNet]
    deploy:
      replicas: 0
      restart_policy: { condition: none }
      resources: { limits: { memory: 256M } }

  backup:
    # Mesmo SHA do deploy (nunca :latest). CI exporta BACKUP_TAG=$IMAGE_TAG.
    image: ghcr.io/tarcisodev/sejaengajado-backup:${BACKUP_TAG:?BACKUP_TAG required}
    environment:
      TZ: UTC
      BACKUP_DATABASE_URL_FILE: /run/secrets/se_backup_database_url
      BACKUP_AGE_PUBKEY_FILE: /run/secrets/se_backup_age_pubkey
      RCLONE_CONFIG: /run/secrets/se_rclone_conf
      HC_BACKUP_URL_FILE: /run/secrets/se_hc_backup_url
      BACKUP_RCLONE_REMOTE: r2:se-backup
    secrets:
      - se_backup_database_url
      - se_backup_age_pubkey
      - se_rclone_conf
      - se_hc_backup_url
    # Postgres em supabase_supabase_db + egress R2/Healthchecks — ambos na TarcisoDevNet.
    networks: [TarcisoDevNet]
    logging: *logging
    deploy:
      <<: *deploy_common
      replicas: 1
      resources:
        reservations: { memory: 32M }
        limits: { memory: 128M }

networks:
  TarcisoDevNet: { external: true }
  se_internal: { driver: overlay, internal: true, attachable: false }

secrets:
  se_database_url: { external: true, name: se_database_url_v1 }
  se_admin_database_url: { external: true, name: se_admin_database_url_v1 }
  se_backup_database_url: { external: true, name: se_backup_database_url_v1 }
  se_supabase_jwt_secret: { external: true, name: se_supabase_jwt_secret_v1 }
  se_supabase_service_role_key: { external: true, name: se_supabase_service_role_key_v1 }
  se_smtp_url: { external: true, name: se_smtp_url_v1 }
  se_asaas_api_key: { external: true, name: se_asaas_api_key_v1 }
  se_asaas_webhook_token: { external: true, name: se_asaas_webhook_token_v1 }
  se_s3_access_key: { external: true, name: se_s3_access_key_v1 }
  se_s3_secret_key: { external: true, name: se_s3_secret_key_v1 }
  se_backup_age_pubkey: { external: true, name: se_backup_age_pubkey_v1 }
  se_rclone_conf: { external: true, name: se_rclone_conf_v1 }
  se_hc_backup_url: { external: true, name: se_hc_backup_url_v1 }
  se_hc_jobs_url: { external: true, name: se_hc_jobs_url_v1 }
  se_sentry_dsn: { external: true, name: se_sentry_dsn_v1 }
