# Gateway local: expoe GoTrue em :9999 com prefixo /auth/v1 (igual producao via Traefik).
# Nunca apontar isto para auth.sejaengajado.com.br.

map $http_origin $cors_origin {
  default "";
  "~^http://app\.localhost(:\d+)?$" $http_origin;
  "~^http://127\.0\.0\.1(:\d+)?$" $http_origin;
  "~^http://localhost(:\d+)?$" $http_origin;
}

server {
  listen 80;
  server_name _;

  location = /health {
    proxy_pass http://gotrue:9999/health;
  }

  location /auth/v1/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $cors_origin always;
      add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
      add_header Access-Control-Allow-Headers "authorization,apikey,content-type,x-client-info,x-supabase-api-version,x-retry-count" always;
      add_header Access-Control-Max-Age 600 always;
      add_header Content-Length 0;
      add_header Content-Type text/plain;
      return 204;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://gotrue:9999/;

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Headers "authorization,apikey,content-type,x-client-info,x-supabase-api-version,x-retry-count" always;
    add_header Access-Control-Expose-Headers "x-supabase-api-version" always;
    add_header Vary Origin always;
  }
}
