# Stack local: Postgres 16 + GoTrue (dev) + Mailpit.
# Segredos: arquivo `.env.local` na raiz (fora do git). Nunca usar auth de produção.
# Subir: docker compose -f docker-compose.dev.yml --env-file .env.local up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Role `postgres` exigida pelas migrations do GoTrue (GRANT … TO postgres).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: sejaengajado
    ports:
      - "5432:5432"
    volumes:
      # Cria schema auth para o GoTrue (só na 1ª subida do volume).
      - ./infra/auth/dev-init-auth-schema.sql:/docker-entrypoint-initdb.d/01-auth-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sejaengajado"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025" # UI — OTP visível aqui
      - "1025:1025" # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  auth-templates:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/auth/templates:/usr/share/nginx/html:ro

  gotrue:
    image: supabase/gotrue:v2.182.1
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      auth-templates:
        condition: service_started
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_DRIVER: postgres
      # search_path=auth evita enums/migrations em public (conflito com public.users da app).
      GOTRUE_DB_DATABASE_URL: postgres://postgres:local-dev-only@postgres:5432/sejaengajado?search_path=auth
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_SITE_URL: http://app.localhost:4200
      GOTRUE_URI_ALLOW_LIST: >-
        http://app.localhost:4200,http://app.localhost:4200/**,http://127.0.0.1:4200,http://127.0.0.1:4200/**,http://localhost:4200,http://localhost:4200/**
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_SECRET: "${SUPABASE_JWT_SECRET:?set_SUPABASE_JWT_SECRET_in_.env.local}"
      GOTRUE_JWT_ISSUER: http://localhost:9999/auth/v1
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_MAILER_OTP_LENGTH: "6"
      GOTRUE_MAILER_OTP_EXP: "600"
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "Seu código de acesso - Seja Engajado (dev)"
      GOTRUE_MAILER_SUBJECTS_INVITE: "Convite - Seja Engajado (dev)"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Recuperar acesso - Seja Engajado (dev)"
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://auth-templates/otp.html
      GOTRUE_MAILER_TEMPLATES_INVITE: http://auth-templates/invite.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://auth-templates/recovery.html
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@localhost
      GOTRUE_SMTP_SENDER_NAME: Seja Engajado Dev
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "100"
      GOTRUE_RATE_LIMIT_OTP: "100"
      GOTRUE_RATE_LIMIT_VERIFY: "100"
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: "5"
      GOTRUE_LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  auth-gateway:
    image: nginx:1.27-alpine
    depends_on:
      gotrue:
        condition: service_healthy
    ports:
      - "9999:80"
    volumes:
      - ./infra/auth/dev-nginx.conf:/etc/nginx/conf.d/default.conf:ro
