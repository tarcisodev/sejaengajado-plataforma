# Trilhos de risco — ADR-003. O maior trilho tocado no diff vence.
# Padrões: glob estilo minimatch (**, *, ?). Prefixo "!" = exclusão dentro do trilho.

baixo:
  - "docs/**"
  - "**/*.spec.ts"
  - "**/*.int-spec.ts"
  - "**/e2e/**"
  - "web/e2e/**"
  - "web/src/**"
  - "web/public/**"
  - "web/scripts/**"
  - "web/*.json"
  - "web/*.md"
  - "!web/src/app/core/auth/**"
  - "!web/src/app/features/auth/**"
  - "!web/src/server.ts"

medio:
  - "api/src/**"
  - "!api/src/auth/**"
  - "!api/src/billing/**"
  - "!api/src/payments/**"
  - "!api/src/webhooks/**"
  - "!api/src/ledger/**"
  - "!api/src/tenant/**"
  - "api/prisma/seed*.ts"
  - "api/prisma/seed/**"
  - "**/templates/**"
  - "web/src/server.ts"
  - "api/test/**"
  - "api/scripts/**"

alto:
  - "api/src/auth/**"
  - "web/src/app/core/auth/**"
  - "web/src/app/features/auth/**"
  - "api/prisma/migrations/**"
  - "api/src/tenant/**"
  - "api/src/billing/**"
  - "api/src/payments/**"
  - "api/src/webhooks/**"
  - "api/src/ledger/**"
  - "**/*asaas*"
  - "**/*webhook*"
  - "**/*fatura*"
  - "**/*multa*"
  - "infra/**"
  - "**/stack*.yml"
  - "docker-compose*.yml"
  - ".github/**"
  - "scripts/ci/**"
  - "**/rls*"
