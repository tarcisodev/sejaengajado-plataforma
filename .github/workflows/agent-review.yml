# Revisor em modo sombra — ADR-003 etapa 2. Não aprova nem faz merge.
name: agent-review

on:
  workflow_run:
    workflows: ["pr-ci"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  review:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: [self-hosted, linux, vps]
    steps:
      - name: Resolver PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${run.head_branch}`,
              per_page: 10,
            });
            const pr = prs.find(p => p.head.sha === run.head_sha) || prs[0];
            if (!pr) {
              core.setFailed('PR não encontrado para este workflow_run');
              return;
            }
            core.setOutput('number', String(pr.number));
            core.setOutput('title', pr.title);
            core.setOutput('body', pr.body || '');
            core.setOutput('sha', pr.head.sha);
            core.setOutput('base', pr.base.ref);
            const closes = (pr.body || '').match(/Closes\s+#(\d+)/i);
            core.setOutput('issue', closes ? closes[1] : '');

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0

      - name: Diff + CI summary
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p artifacts/review
          git fetch origin "${{ steps.pr.outputs.base }}" --depth=50 || true
          git diff --unified=3 "origin/${{ steps.pr.outputs.base }}...${{ steps.pr.outputs.sha }}" > artifacts/review/diff.patch || true
          gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" --jq '.jobs[] | {name, conclusion, steps: [.steps[] | {name, conclusion}]}' > artifacts/review/ci.json || echo '[]' > artifacts/review/ci.json
          node scripts/ci/risk-tier.mjs --base "origin/${{ steps.pr.outputs.base }}" --head HEAD --json > artifacts/review/risk.json
          echo "RISK_TIER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('artifacts/review/risk.json','utf8')).tier)")" >> "$GITHUB_ENV"

      - name: Issue vinculada (Closes #N)
        if: ${{ steps.pr.outputs.issue != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${{ steps.pr.outputs.issue }}" --jq '{title, body, labels: [.labels[].name]}' > artifacts/review/issue.json || echo '{}' > artifacts/review/issue.json

      - name: Token App (opcional se-reviewer)
        id: app
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "Usando GitHub App (token via gh-app) — placeholder: GITHUB_TOKEN neste momento"
            echo "token_source=github_token" >> "$GITHUB_OUTPUT"
          else
            echo "token_source=github_token" >> "$GITHUB_OUTPUT"
          fi

      - name: Rodar revisor
        env:
          REVIEW_LLM_API_KEY: ${{ secrets.REVIEW_LLM_API_KEY }}
          REVIEW_LLM_BASE: ${{ vars.REVIEW_LLM_BASE }}
          REVIEW_LLM_MODEL: ${{ vars.REVIEW_LLM_MODEL }}
          MONTHLY_TOKEN_CAP: ${{ vars.MONTHLY_TOKEN_CAP }}
          DIFF_PATH: artifacts/review/diff.patch
          CI_SUMMARY_PATH: artifacts/review/ci.json
          ISSUE_BODY_PATH: artifacts/review/issue.json
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RISK_TIER: ${{ env.RISK_TIER }}
          REVIEW_OUT_DIR: artifacts/review
          TOKEN_USAGE_PATH: artifacts/review/token-usage.json
        run: node scripts/ci/agent-review.mjs

      - name: Comentar PR + labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RISK_TIER: ${{ env.RISK_TIER }}
          COMMENT_PATH: artifacts/review/comment.md
          REVIEW_PATH: artifacts/review/review.json
        run: node scripts/ci/post-review-comment.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: agent-review-pr-${{ steps.pr.outputs.number }}
          path: artifacts/review
          retention-days: 30
