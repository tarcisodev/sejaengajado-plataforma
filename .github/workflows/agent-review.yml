# Revisor em modo sombra — ADR-003 etapa 2. Não aprova nem faz merge.
# PR code entra só como diff (mitiga pwn request em workflow_run).
name: agent-review

on:
  workflow_run:
    workflows: ["pr-ci"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  review:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolver PR
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${run.head_branch}`,
              per_page: 10,
            });
            const pr = prs.find(p => p.head.sha === run.head_sha) || prs[0];
            if (!pr) {
              core.setFailed('PR não encontrado para este workflow_run');
              return;
            }
            core.setOutput('number', String(pr.number));
            core.setOutput('title', pr.title);
            core.setOutput('body', pr.body || '');
            core.setOutput('sha', pr.head.sha);
            core.setOutput('base', pr.base.ref);
            const closes = (pr.body || '').match(/Closes\s+#(\d+)/i);
            core.setOutput('issue', closes ? closes[1] : '');

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Diff + CI summary
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          BASE: ${{ steps.pr.outputs.base }}
          SHA: ${{ steps.pr.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/review
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # Checkout ficou na default branch; PR entra só como ref remota (não como working tree).
          git fetch --no-tags origin "${BASE}:refs/remotes/origin/${BASE}" || git fetch --no-tags origin "${BASE}"
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          git rev-parse --verify "${SHA}^{commit}" >/dev/null
          git merge-base "origin/${BASE}" "${SHA}" >/dev/null
          git diff "origin/${BASE}...${SHA}" > artifacts/review/diff.patch
          test -s artifacts/review/diff.patch || echo "::warning::diff.patch vazio (possível PR sem mudanças de arquivo)"
          gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" --jq '.jobs[] | {name, conclusion, steps: [.steps[] | {name, conclusion}]}' > artifacts/review/ci.json || echo '[]' > artifacts/review/ci.json
          node scripts/ci/risk-tier.mjs --base "origin/${BASE}" --head "${SHA}" --json > artifacts/review/risk.json
          echo "RISK_TIER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('artifacts/review/risk.json','utf8')).tier)")" >> "$GITHUB_ENV"

      - name: Issue vinculada (Closes #N)
        if: ${{ steps.pr.outputs.issue != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.pr.outputs.issue }}
        run: |
          gh api "repos/${REPO}/issues/${ISSUE}" --jq '{title, body, labels: [.labels[].name]}' > artifacts/review/issue.json || echo '{}' > artifacts/review/issue.json

      - name: Rodar revisor
        env:
          REVIEW_LLM_API_KEY: ${{ secrets.REVIEW_LLM_API_KEY }}
          REVIEW_LLM_BASE: ${{ vars.REVIEW_LLM_BASE }}
          REVIEW_LLM_MODEL: ${{ vars.REVIEW_LLM_MODEL }}
          MONTHLY_TOKEN_CAP: ${{ vars.MONTHLY_TOKEN_CAP }}
          DIFF_PATH: artifacts/review/diff.patch
          CI_SUMMARY_PATH: artifacts/review/ci.json
          ISSUE_BODY_PATH: artifacts/review/issue.json
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RISK_TIER: ${{ env.RISK_TIER }}
          REVIEW_OUT_DIR: artifacts/review
          TOKEN_USAGE_PATH: artifacts/review/token-usage.json
        run: |
          if [ ! -f artifacts/review/issue.json ]; then echo '{}' > artifacts/review/issue.json; fi
          node scripts/ci/agent-review.mjs

      - name: Comentar PR + labels
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RISK_TIER: ${{ env.RISK_TIER }}
          COMMENT_PATH: artifacts/review/comment.md
          REVIEW_PATH: artifacts/review/review.json
        run: node scripts/ci/post-review-comment.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-review-pr-${{ steps.pr.outputs.number }}
          path: artifacts/review
          retention-days: 30
