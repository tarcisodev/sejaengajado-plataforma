# Build → GHCR (tag = git SHA only; never :latest in production).
# Deploy on self-hosted VPS runner after manual approval (environment: production).
# Rollback = redeploy previous SHA (workflow_dispatch.rollback_tag) or Swarm service rollback.
# Secrets in this file: only secrets.GITHUB_TOKEN (GHCR login). No Asaas/DB/R2 tokens here.

name: build-and-deploy

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "PROGRESS.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: "SHA already on GHCR to redeploy (skip build/migrate)"
        required: false
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

# Mínimo no topo; cada job declara o que precisa (packages: write só no build).
permissions:
  contents: read

env:
  # Lowercase owner — must match infra/stack.yml (nunca :latest).
  REGISTRY: ghcr.io/tarcisodev

jobs:
  migration-guard:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.rollback_tag == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Expand/contract — block DROP/RENAME after production baseline
        env:
          BASE_REF: ${{ github.event.before }}
          # Migrations ≤ 20261015250000 já aplicadas; ver check-migration-expand.sh
          MIGRATION_EXPAND_BASELINE: "20261015250000"
        run: bash infra/scripts/check-migration-expand.sh
      - name: Traefik HostRegexp — single backslash after Compose $$
        run: node infra/scripts/check-traefik-hostregexp.mjs

  build:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.rollback_tag == '') }}
    needs: [migration-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: api
            context: api
            file: api/Dockerfile
          - app: web
            context: web
            file: web/Dockerfile
          - app: backup
            context: infra/backup
            file: infra/backup/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (SHA tag only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.REGISTRY }}/sejaengajado-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: API image must keep dist/main.js (seed compiles to dist-seed/)
        if: matrix.app == 'api'
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          img="${REGISTRY}/sejaengajado-api:${IMAGE_SHA}"
          docker pull "$img"
          docker run --rm --entrypoint sh "$img" -c 'test -f /app/dist/main.js && test -f /app/dist-seed/seed-showcase.js'

  deploy:
    needs: [build]
    if: ${{ always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.rollback_tag != '')) }}
    runs-on: [self-hosted, linux, vps]
    # Gate (≤ 12 min) + smoke (≤ 8 min) + observação (≤ 5 min) + migrations + rollback (~2 min).
    # Cada step longo tem timeout próprio: estouro vira failure e o rollback roda.
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      # Pull das imagens GHCR no Swarm (registry auth do stack deploy); push só no job build.
      packages: read
    env:
      IMAGE_TAG: ${{ inputs.rollback_tag || github.sha }}
      BACKUP_TAG: ${{ inputs.rollback_tag || github.sha }}
      # Públicos / não-secretos — GitHub Environment vars (production).
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      ASAAS_BASE_URL: ${{ vars.ASAAS_BASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Redeploy de SHA antigo: compose/scripts do commit de destino.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_tag != '' && inputs.rollback_tag || github.sha }}

      - name: Login GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Guarda de RAM
        run: |
          avail=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)
          echo "MemAvailable=${avail}MiB"
          test "$avail" -gt 600 || { echo "RAM insuficiente para start-first"; exit 1; }

      - name: Registrar tag anterior (rollback alvo)
        run: |
          prev=$(docker service inspect sejaengajado_api --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null | sed 's/.*://;s/@.*//' || true)
          echo "PREV_TAG=$prev" >> "$GITHUB_ENV"
          echo "imagem anterior: ${prev:-none}"

      - name: Backup pré-migração
        if: ${{ inputs.rollback_tag == '' }}
        run: |
          cid=$(docker ps -q -f name=sejaengajado_backup | head -1 || true)
          if [ -n "$cid" ]; then
            docker exec "$cid" /usr/local/bin/pg-backup.sh "pre-deploy-${IMAGE_TAG::7}"
          else
            echo "serviço backup ainda não existe — pulando pré-backup (primeiro deploy)"
          fi

      - name: Migrations (one-off; skipped on SHA rollback)
        if: ${{ inputs.rollback_tag == '' }}
        run: |
          chmod +x infra/scripts/wait-oneoff.sh
          export IMAGE_TAG BACKUP_TAG S3_ENDPOINT SUPABASE_ANON_KEY
          # Alinha com infra/stack.yml: produção = api.asaas.com (nunca sandbox por omissão).
          # Sandbox só via vars.ASAAS_BASE_URL explícito — e o gate abaixo bloqueia em production.
          export ASAAS_BASE_URL="${ASAAS_BASE_URL:-https://api.asaas.com/v3}"
          case "$ASAAS_BASE_URL" in
            *sandbox*) echo "ASAAS_BASE_URL sandbox proibido no environment production" >&2; exit 1 ;;
          esac
          docker service update --detach=true --with-registry-auth \
            --image "${REGISTRY}/sejaengajado-api:${IMAGE_TAG}" \
            --replicas 1 sejaengajado_migrate
          ./infra/scripts/wait-oneoff.sh sejaengajado_migrate 180
          docker service scale sejaengajado_migrate=0

      - name: Stack deploy (SHA imutável)
        run: |
          export IMAGE_TAG BACKUP_TAG S3_ENDPOINT SUPABASE_ANON_KEY
          # Mesmo default de infra/stack.yml (produção). Ver runbook virar-asaas-producao.md.
          export ASAAS_BASE_URL="${ASAAS_BASE_URL:-https://api.asaas.com/v3}"
          case "$ASAAS_BASE_URL" in
            *sandbox*) echo "ASAAS_BASE_URL sandbox proibido no environment production" >&2; exit 1 ;;
          esac
          test -n "$S3_ENDPOINT" || { echo "vars.S3_ENDPOINT obrigatório no environment production" >&2; exit 1; }
          # Fail closed if a :latest tag sneaks into the compose render.
          if docker stack config -c infra/stack.yml | grep -E ':latest([[:space:]]|$)'; then
            echo "proibido :latest em produção" >&2
            exit 1
          fi
          docker stack deploy --with-registry-auth --prune=false -c infra/stack.yml sejaengajado
          echo "DEPLOYED=1" >> "$GITHUB_ENV"

      - name: Gate de saúde
        timeout-minutes: 12
        run: |
          set -euo pipefail
          IMAGE_TAG="${IMAGE_TAG:?}"
          ok=0
          for i in $(seq 1 48); do
            api_img=$(docker service inspect sejaengajado_api --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null || true)
            web_img=$(docker service inspect sejaengajado_web-ssr --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null || true)
            api_upd=$(docker service inspect sejaengajado_api --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}' 2>/dev/null || true)
            web_upd=$(docker service inspect sejaengajado_web-ssr --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}' 2>/dev/null || true)

            if echo "$api_upd$web_upd" | grep -Eiq 'rollback'; then
              echo "serviço em rollback (api=$api_upd web=$web_upd)" >&2
              exit 1
            fi

            # Image tag must match the deployed SHA (digest-only is not enough).
            api_sha_ok=0
            web_sha_ok=0
            [[ "$api_img" == *":${IMAGE_TAG}"* ]] && api_sha_ok=1
            [[ "$web_img" == *":${IMAGE_TAG}"* ]] && web_sha_ok=1

            api_ready=0
            web_ready=0
            front_ok=0
            web_hz=0
            tenant_ok=0
            if curl -fsS --max-time 5 "https://app.sejaengajado.com.br/api/health/ready" >/dev/null; then
              api_ready=1
            fi
            if curl -fsS --max-time 5 -o /dev/null -w "%{http_code}" "https://app.sejaengajado.com.br/entrar" | grep -Eq '200|301|302'; then
              front_ok=1
            fi
            if curl -fsS --max-time 5 "https://app.sejaengajado.com.br/healthz" | grep -qx 'ok'; then
              web_hz=1
            fi
            # Smoke somente-leitura: cada demo N vezes (intermitência não passa com 1 GET).
            tenant_ok=1
            TENANT_ATTEMPTS="${TENANT_SMOKE_ATTEMPTS:-5}"
            for pair in "demo-forno:Forno" "demo-barbearia:Barbearia" "demo-estudio:Luz"; do
              slug="${pair%%:*}"
              needle="${pair##*:}"
              ok_n=0
              for ((t=1; t<=TENANT_ATTEMPTS; t++)); do
                body="$(mktemp)"
                code=$(curl -sS --max-time 15 -o "$body" -w "%{http_code}" \
                  "https://${slug}.sejaengajado.com.br/" || echo "000")
                if [[ "$code" == "200" ]] && grep -Fq "$needle" "$body" \
                  && ! grep -Eiq 'Negócio não encontrado|Não encontramos esse negócio' "$body"; then
                  ok_n=$((ok_n + 1))
                fi
                rm -f "$body"
              done
              if [[ "$ok_n" -lt "$TENANT_ATTEMPTS" ]]; then
                echo "tenant smoke FAIL slug=$slug ok=$ok_n/$TENANT_ATTEMPTS"
                tenant_ok=0
              else
                echo "tenant smoke OK slug=$slug ok=$ok_n/$TENANT_ATTEMPTS"
              fi
            done
            miss_body="$(mktemp)"
            miss_code=$(curl -sS --max-time 10 -o "$miss_body" -w "%{http_code}" \
              "https://slug-inexistente-fluxo-feliz.sejaengajado.com.br/" || echo "000")
            if [[ "$miss_code" != "404" ]] || grep -Fqi '404 page not found' "$miss_body"; then
              tenant_ok=0
            fi
            rm -f "$miss_body"
            # Running task count for web-ssr
            web_running=$(docker service ps sejaengajado_web-ssr --filter desired-state=running --format '{{.CurrentState}}' 2>/dev/null | grep -c '^Running' || true)
            [[ "${web_running:-0}" -ge 1 ]] && web_ready=1 || web_ready=0

            # HostRegexp label must not be double-escaped after stack render.
            rule_ok=0
            rule=$(docker service inspect sejaengajado_web-ssr \
              --format '{{index .Spec.Labels "traefik.http.routers.se-web.rule"}}' 2>/dev/null || true)
            if [[ "$rule" == *'HostRegexp(`^[a-z0-9-]+\.sejaengajado\.com\.br$`)'* ]]; then
              rule_ok=1
            fi

            echo "gate try=$i api_tag=$api_sha_ok web_tag=$web_sha_ok api_ready=$api_ready front=$front_ok healthz=$web_hz tenant=$tenant_ok rule=$rule_ok web_run=$web_ready upd=api:$api_upd/web:$web_upd"

            if [[ "$api_sha_ok" -eq 1 && "$web_sha_ok" -eq 1 && "$api_ready" -eq 1 && "$front_ok" -eq 1 && "$web_hz" -eq 1 && "$tenant_ok" -eq 1 && "$rule_ok" -eq 1 && "$web_ready" -eq 1 ]]; then
              # Update finished (or first deploy with empty UpdateStatus)
              if [[ -z "$api_upd" || "$api_upd" == "completed" ]] && [[ -z "$web_upd" || "$web_upd" == "completed" ]]; then
                echo "health ok (api + web-ssr + tenant HostRegexp no SHA ${IMAGE_TAG})"
                ok=1
                break
              fi
            fi
            sleep 5
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "healthcheck falhou — serviços não convergiram no SHA ${IMAGE_TAG}" >&2
            docker service ps sejaengajado_api --no-trunc 2>/dev/null | head -20 || true
            docker service ps sejaengajado_web-ssr --no-trunc 2>/dev/null | head -20 || true
            docker service inspect sejaengajado_web-ssr \
              --format '{{index .Spec.Labels "traefik.http.routers.se-web.rule"}}' 2>/dev/null || true
            exit 1
          fi

      - name: Smoke pós-convergência (20 rodadas × 3 demos + 404, zero falhas)
        timeout-minutes: 8
        env:
          SMOKE_ROUNDS: "20"
          SMOKE_INTERVAL_S: "3"
          SMOKE_MAX_TIME_S: "2"
          UA_BROWSER: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          UA_CURL: "curl/8.5.0"
        run: |
          set -euo pipefail
          # slug|nome do negócio (api/prisma/showcase-formula-content.ts).
          demos=(
            "demo-forno|Forno da Praça"
            "demo-barbearia|Barbearia do Centro"
            "demo-estudio|Estúdio Luz Local"
          )
          missing_slug="slug-inexistente-smoke-ci"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT

          # $1=url $2=UA → imprime "code time_total" (curl nunca aborta o script).
          probe() {
            curl -sS -A "$2" --max-time 5 -o "$body" -w '%{http_code} %{time_total}\n' "$1" 2>/dev/null || echo "000 9.999"
          }
          slow() { awk -v t="$1" -v m="$SMOKE_MAX_TIME_S" 'BEGIN { exit !(t >= m) }'; }

          fails=0
          for ((r=1; r<=SMOKE_ROUNDS; r++)); do
            for pair in "${demos[@]}"; do
              slug="${pair%%|*}"
              needle="${pair#*|}"
              for ua in "$UA_BROWSER" "$UA_CURL"; do
                ua_tag="browser"; [[ "$ua" == "$UA_CURL" ]] && ua_tag="curl"
                read -r code t < <(probe "https://${slug}.sejaengajado.com.br/" "$ua")
                if [[ "$code" != "200" ]]; then
                  echo "::error::smoke r=$r slug=$slug ua=$ua_tag code=$code t=${t}s"; fails=$((fails + 1)); continue
                fi
                if ! grep -Fq "$needle" "$body" || grep -Eiq 'Negócio não encontrado|Não encontramos esse negócio' "$body"; then
                  echo "::error::smoke r=$r slug=$slug ua=$ua_tag 200 sem \"$needle\" (soft 404?)"; fails=$((fails + 1)); continue
                fi
                if slow "$t"; then
                  echo "::error::smoke r=$r slug=$slug ua=$ua_tag lento t=${t}s (limite ${SMOKE_MAX_TIME_S}s)"; fails=$((fails + 1)); continue
                fi
              done
            done
            read -r code t < <(probe "https://${missing_slug}.sejaengajado.com.br/" "$UA_BROWSER")
            if [[ "$code" != "404" ]] || grep -Fqi '404 page not found' "$body"; then
              # "404 page not found" = Traefik sem rota (HostRegexp quebrado), não o SSR.
              echo "::error::smoke r=$r slug=$missing_slug code=$code (esperado 404 do SSR)"; fails=$((fails + 1))
            elif slow "$t"; then
              echo "::error::smoke r=$r slug=$missing_slug lento t=${t}s"; fails=$((fails + 1))
            fi
            echo "smoke rodada $r/$SMOKE_ROUNDS falhas_acumuladas=$fails"
            if [[ "$fails" -gt 0 ]]; then
              echo "smoke pós-convergência FALHOU (tolerância zero) — rollback" >&2
              exit 1
            fi
            if [[ "$r" -lt "$SMOKE_ROUNDS" ]]; then sleep "$SMOKE_INTERVAL_S"; fi
          done
          echo "smoke pós-convergência OK: ${SMOKE_ROUNDS} rodadas × ${#demos[@]} demos × 2 UAs + 404"

      - name: Janela de observação (réplicas estáveis, sem rollback do Swarm)
        timeout-minutes: 5
        env:
          OBSERVE_SECONDS: "150"
          OBSERVE_TICK_S: "10"
        run: |
          set -euo pipefail
          IMAGE_TAG="${IMAGE_TAG:?}"
          services=(sejaengajado_api sejaengajado_web-ssr)
          declare -A baseline
          for svc in "${services[@]}"; do
            baseline[$svc]=$(docker service ps "$svc" --filter desired-state=running -q | sort | tr '\n' ' ')
            echo "baseline $svc tasks=[${baseline[$svc]}]"
          done
          end=$((SECONDS + OBSERVE_SECONDS))
          tick=0
          while [[ "$SECONDS" -lt "$end" ]]; do
            tick=$((tick + 1))
            for svc in "${services[@]}"; do
              img=$(docker service inspect "$svc" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
              upd=$(docker service inspect "$svc" --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}')
              reps=$(docker service ls --format '{{.Name}} {{.Replicas}}' | awk -v s="$svc" '$1 == s { print $2 }')
              tasks=$(docker service ps "$svc" --filter desired-state=running -q | sort | tr '\n' ' ')
              echo "observe tick=$tick $svc reps=$reps upd=${upd:-none}"
              if [[ "$img" != *":${IMAGE_TAG}"* ]]; then
                echo "::error::$svc saiu do SHA ${IMAGE_TAG} (imagem atual: ${img##*/})"; exit 1
              fi
              if echo "$upd" | grep -Eiq 'rollback|paused'; then
                echo "::error::$svc em estado de update '$upd'"; exit 1
              fi
              cur="${reps%%/*}"; want="${reps##*/}"; want="${want%% *}"
              if [[ -z "$reps" || "$cur" != "$want" || "$want" == "0" ]]; then
                echo "::error::$svc réplicas instáveis ($reps)"; exit 1
              fi
              if [[ "$tasks" != "${baseline[$svc]}" ]]; then
                echo "::error::$svc trocou de task durante a observação (restart/crash): [${baseline[$svc]}] → [$tasks]"; exit 1
              fi
            done
            curl -fsS --max-time 5 "https://app.sejaengajado.com.br/api/health/ready" >/dev/null \
              || { echo "::error::api /health/ready falhou na observação"; exit 1; }
            sleep "$OBSERVE_TICK_S"
          done
          echo "observação OK (${OBSERVE_SECONDS}s): api + web-ssr estáveis no SHA ${IMAGE_TAG}"

      - name: Rollback automático (só se stack deploy já rodou)
        # cancelled(): cancelamento manual ou timeout do job também volta para a tag anterior.
        if: (failure() || cancelled()) && env.DEPLOYED == '1' && env.PREV_TAG != ''
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [[ "$PREV_TAG" == "$IMAGE_TAG" ]]; then
            echo "::error::redeploy do mesmo SHA (${IMAGE_TAG}); sem rollback possível"
            exit 1
          fi
          echo "rollback Swarm → tag anterior ${PREV_TAG}"
          for svc in sejaengajado_api sejaengajado_web-ssr; do
            cur=$(docker service inspect "$svc" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
            # Swarm (update_config.failure_action=rollback) pode já ter voltado sozinho;
            # rollback de novo trocaria PreviousSpec e reaplicaria o SHA ruim.
            if [[ "$cur" == *":${PREV_TAG}"* ]]; then
              echo "$svc já está em ${PREV_TAG} — sem rollback adicional"
            else
              docker service rollback "$svc"
            fi
          done
          # Confere que a tag voltou (não engolir falha).
          for i in $(seq 1 24); do
            api_img=$(docker service inspect sejaengajado_api --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
            web_img=$(docker service inspect sejaengajado_web-ssr --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
            api_ok=0
            web_ok=0
            [[ "$api_img" == *":${PREV_TAG}"* ]] && api_ok=1
            [[ "$web_img" == *":${PREV_TAG}"* ]] && web_ok=1
            echo "rollback check try=$i api_ok=$api_ok web_ok=$web_ok"
            if [[ "$api_ok" -eq 1 && "$web_ok" -eq 1 ]]; then
              echo "::error::rollback Swarm para tag anterior (${PREV_TAG}). Migrations NÃO foram revertidas."
              echo "Para redeploy explícito de um SHA: workflow_dispatch com rollback_tag=<sha>"
              exit 0
            fi
            sleep 5
          done
          echo "::error::rollback não confirmou tag ${PREV_TAG} em api/web-ssr" >&2
          exit 1
