# PR CI — alvo < 5 min de relógio (ubuntu-latest paralelo).
# VPS self-hosted fica só no deploy. Sem secrets de produção.
name: pr-ci

on:
  pull_request:
    branches: [master, main]

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: "22"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      code: ${{ steps.filter.outputs.code }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      docker: ${{ steps.filter.outputs.docker }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            web:
              - 'web/**'
            docker:
              - '**/Dockerfile'
              - '**/Dockerfile.*'
              - 'api/package.json'
              - 'api/package-lock.json'
              - 'web/package.json'
              - 'web/package-lock.json'
              - 'api/src/**'
              - 'web/src/**'
              - 'api/prisma/**'
            e2e:
              - 'api/**'
              - 'web/**'
              - 'docker-compose.dev.yml'
              - 'scripts/dev-auth.mjs'
              - '.env.local.example'
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!PROGRESS.md'
              - '!.github/ISSUE_TEMPLATE/**'

  setup:
    needs: [changes]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: nm-api
        with:
          path: api/node_modules
          key: ${{ runner.os }}-nm-api-${{ hashFiles('api/package-lock.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: nm-web
        with:
          path: web/node_modules
          key: ${{ runner.os }}-nm-web-${{ hashFiles('web/package-lock.json') }}
      - name: npm ci api
        if: steps.nm-api.outputs.cache-hit != 'true' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.e2e == 'true')
        working-directory: api
        run: npm ci
      - name: npm ci web
        if: steps.nm-web.outputs.cache-hit != 'true' && (needs.changes.outputs.web == 'true' || needs.changes.outputs.e2e == 'true')
        working-directory: web
        run: npm ci

  guards:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Risk tier
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_REF: ${{ github.sha }}
        run: |
          node scripts/ci/risk-tier.mjs --json | tee risk.json
          tier=$(node -e "console.log(JSON.parse(require('fs').readFileSync('risk.json','utf8')).tier)")
          echo "Trilho: $tier"
      - name: Migration expand-only + Traefik HostRegexp
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          MIGRATION_EXPAND_BASELINE: "20261015250000"
        run: |
          bash infra/scripts/check-migration-expand.sh
          node infra/scripts/check-traefik-hostregexp.mjs
      - name: Gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --verbose --redact \
            --log-opts="${BASE_SHA}..${HEAD_SHA}"

  lint:
    needs: [changes, setup]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: nm-api
        if: needs.changes.outputs.api == 'true'
        with:
          path: api/node_modules
          key: ${{ runner.os }}-nm-api-${{ hashFiles('api/package-lock.json') }}
      - name: npm ci api (cache miss fallback)
        if: needs.changes.outputs.api == 'true' && steps.nm-api.outputs.cache-hit != 'true'
        working-directory: api
        run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: nm-web
        if: needs.changes.outputs.web == 'true'
        with:
          path: web/node_modules
          key: ${{ runner.os }}-nm-web-${{ hashFiles('web/package-lock.json') }}
      - name: npm ci web (cache miss fallback)
        if: needs.changes.outputs.web == 'true' && steps.nm-web.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci
      - name: API lint
        if: needs.changes.outputs.api == 'true'
        working-directory: api
        run: |
          npx prisma generate
          npm run lint
          npm run lint:money
      - name: Web lint + format
        if: needs.changes.outputs.web == 'true'
        working-directory: web
        run: |
          npm run lint
          npm run format:check

  test:
    needs: [changes, setup]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: nm-api
        if: needs.changes.outputs.api == 'true'
        with:
          path: api/node_modules
          key: ${{ runner.os }}-nm-api-${{ hashFiles('api/package-lock.json') }}
      - name: npm ci api (cache miss fallback)
        if: needs.changes.outputs.api == 'true' && steps.nm-api.outputs.cache-hit != 'true'
        working-directory: api
        run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: nm-web
        if: needs.changes.outputs.web == 'true'
        with:
          path: web/node_modules
          key: ${{ runner.os }}-nm-web-${{ hashFiles('web/package-lock.json') }}
      - name: npm ci web (cache miss fallback)
        if: needs.changes.outputs.web == 'true' && steps.nm-web.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci
      - name: API unit
        if: needs.changes.outputs.api == 'true'
        working-directory: api
        run: |
          npx prisma generate
          npm test
      - name: Chrome for Karma
        if: needs.changes.outputs.web == 'true'
        id: chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3
      - name: Web typecheck + unit
        if: needs.changes.outputs.web == 'true'
        working-directory: web
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm run typecheck
          npm test -- --watch=false --browsers=ChromeHeadlessCI

  test-int:
    needs: [changes, setup]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-dev-only
          POSTGRES_DB: sejaengajado
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sejaengajado"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: nm-api
        with:
          path: api/node_modules
          key: ${{ runner.os }}-nm-api-${{ hashFiles('api/package-lock.json') }}
      - name: npm ci api (cache miss fallback)
        if: steps.nm-api.outputs.cache-hit != 'true'
        run: npm ci
      - name: Integration (Testcontainers Postgres + services)
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          npx prisma generate
          npm run test:int

  build:
    needs: [changes, setup]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: nm-api
        with:
          path: api/node_modules
          key: ${{ runner.os }}-nm-api-${{ hashFiles('api/package-lock.json') }}
      - name: npm ci api (cache miss fallback)
        if: steps.nm-api.outputs.cache-hit != 'true'
        working-directory: api
        run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: nm-web
        with:
          path: web/node_modules
          key: ${{ runner.os }}-nm-web-${{ hashFiles('web/package-lock.json') }}
      - name: npm ci web (cache miss fallback)
        if: steps.nm-web.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci
      - name: Build API
        working-directory: api
        run: |
          npx prisma generate
          npm run build
      - name: Build Web
        working-directory: web
        run: npm run build
      - name: Bundle budget
        run: node scripts/ci/bundle-budget.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-dist
          path: |
            api/dist
            api/dist-seed
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: web/dist/web
          retention-days: 1

  docker-build:
    needs: [changes]
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - app: api
            context: api
            file: api/Dockerfile
          - app: web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: se-pr-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=pr-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.app }}
      - name: Smoke API image
        if: matrix.app == 'api'
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          img="se-pr-api:${IMAGE_SHA}"
          docker run --rm --entrypoint sh "$img" -c 'test -f /app/dist/main.js && test -f /app/dist-seed/seed-showcase.js'
          set +e
          timeout 20s docker run --rm --entrypoint node "$img" -e "require('/app/dist/main.js')"
          code=$?
          set -e
          echo "smoke api exit=$code"
          if [ "$code" -eq 125 ] || [ "$code" -eq 126 ] || [ "$code" -eq 127 ]; then
            exit 1
          fi
      - name: Smoke Web image
        if: matrix.app == 'web'
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker run --rm --entrypoint sh "se-pr-web:${IMAGE_SHA}" -c 'test -f /app/dist/web/server/server.mjs'

  e2e:
    needs: [changes, setup, build]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pr-e2e-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-dev-only
          POSTGRES_DB: sejaengajado
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sejaengajado"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: nm-api
        with:
          path: api/node_modules
          key: ${{ runner.os }}-nm-api-${{ hashFiles('api/package-lock.json') }}
      - name: npm ci api (cache miss fallback)
        if: steps.nm-api.outputs.cache-hit != 'true'
        working-directory: api
        run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: nm-web
        with:
          path: web/node_modules
          key: ${{ runner.os }}-nm-web-${{ hashFiles('web/package-lock.json') }}
      - name: npm ci web (cache miss fallback)
        if: steps.nm-web.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('web/package-lock.json') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: api-dist
          path: api
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: web/dist/web
      - name: Dev auth secrets (ephemeral)
        run: |
          cp .env.local.example .env.local
          node scripts/dev-auth.mjs init
      - name: API migrate + seed + start (artifact, sem rebuild)
        working-directory: api
        env:
          DATABASE_URL: postgresql://postgres:local-dev-only@127.0.0.1:5432/sejaengajado?schema=public
          ADMIN_DATABASE_URL: postgresql://postgres:local-dev-only@127.0.0.1:5432/sejaengajado?schema=public
          REDIS_URL: redis://127.0.0.1:6379
          ALLOW_DEMO_SEED: "1"
          PORT: "3000"
          NODE_ENV: development
        run: |
          set -a
          # shellcheck disable=SC1091
          . ../.env.local
          set +a
          npx prisma generate
          npx prisma migrate deploy
          npm run seed:demo
          npm run seed:showcase || node dist-seed/seed-showcase.js
          export SUPABASE_JWT_SECRET_FILE="${SUPABASE_JWT_SECRET_FILE:-}"
          if [ -z "$SUPABASE_JWT_SECRET_FILE" ] && [ -n "${SUPABASE_JWT_SECRET:-}" ]; then
            mkdir -p ../.local/dev-secrets
            printf '%s' "$SUPABASE_JWT_SECRET" > ../.local/dev-secrets/jwt
            export SUPABASE_JWT_SECRET_FILE="$PWD/../.local/dev-secrets/jwt"
          fi
          nohup env \
            DATABASE_URL="$DATABASE_URL" \
            ADMIN_DATABASE_URL="$ADMIN_DATABASE_URL" \
            SUPABASE_URL="${SUPABASE_URL:-http://localhost:9999}" \
            SUPABASE_JWT_SECRET_FILE="$SUPABASE_JWT_SECRET_FILE" \
            ASAAS_BASE_URL="${ASAAS_BASE_URL:-https://sandbox.asaas.com/api/v3}" \
            node dist/main.js > /tmp/se-api-e2e.log 2>&1 &
          echo $! > /tmp/se-api-e2e.pid
          for i in $(seq 1 60); do
            curl -fsS "http://127.0.0.1:3000/api/health/ready" && break
            sleep 1
          done
          curl -fsS "http://127.0.0.1:3000/api/health/ready"
      - name: Web SSR + Playwright @smoke (artifact)
        working-directory: web
        env:
          PORT: "4000"
          API_INTERNAL_URL: http://127.0.0.1:3000
          API_PUBLIC_URL: /api
          PW_CACHE_HIT: ${{ steps.pw.outputs.cache-hit }}
        run: |
          if [ "$PW_CACHE_HIT" != "true" ]; then
            npx playwright install chromium --with-deps
          else
            npx playwright install-deps chromium || true
          fi
          nohup env PORT=4000 API_INTERNAL_URL=http://127.0.0.1:3000 npm run serve:ssr:web > /tmp/se-web-e2e.log 2>&1 &
          echo $! > /tmp/se-web-e2e.pid
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null "http://127.0.0.1:4000/" && break
            sleep 1
          done
          E2E_HAPPY_PATH=1 \
          E2E_BASE_URL=http://127.0.0.1:4000 \
          E2E_APEX=http://127.0.0.1:4000 \
          E2E_APP_BASE=http://127.0.0.1:4000 \
          E2E_API_BASE=http://127.0.0.1:3000 \
          npm run e2e:fluxo-feliz:smoke
      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/se-api-e2e.pid ]; then kill "$(cat /tmp/se-api-e2e.pid)" || true; fi
          if [ -f /tmp/se-web-e2e.pid ]; then kill "$(cat /tmp/se-web-e2e.pid)" || true; fi
          tail -n 80 /tmp/se-api-e2e.log || true
          tail -n 80 /tmp/se-web-e2e.log || true

  pr-ci-ok:
    if: always()
    needs: [changes, setup, guards, lint, test, test-int, build, docker-build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Aggregate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SETUP_RESULT: ${{ needs.setup.result }}
          GUARDS_RESULT: ${{ needs.guards.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_INT_RESULT: ${{ needs.test-int.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          CODE: ${{ needs.changes.outputs.code }}
          API: ${{ needs.changes.outputs.api }}
          WEB: ${{ needs.changes.outputs.web }}
          DOCKER: ${{ needs.changes.outputs.docker }}
          E2E: ${{ needs.changes.outputs.e2e }}
        run: |
          echo "code=$CODE api=$API web=$WEB docker=$DOCKER e2e=$E2E"
          echo "setup=$SETUP_RESULT guards=$GUARDS_RESULT lint=$LINT_RESULT test=$TEST_RESULT"
          echo "test-int=$TEST_INT_RESULT build=$BUILD_RESULT docker-build=$DOCKER_RESULT e2e=$E2E_RESULT"
          test "$CHANGES_RESULT" = "success" || exit 1
          if [ "$CODE" != "true" ]; then
            echo "docs-only — pr-ci-ok"
            exit 0
          fi
          test "$GUARDS_RESULT" = "success" || exit 1
          if [ "$API" = "true" ] || [ "$WEB" = "true" ] || [ "$E2E" = "true" ]; then
            test "$SETUP_RESULT" = "success" || exit 1
          fi
          if [ "$API" = "true" ] || [ "$WEB" = "true" ]; then
            test "$LINT_RESULT" = "success" || exit 1
            test "$TEST_RESULT" = "success" || exit 1
          fi
          if [ "$API" = "true" ]; then
            test "$TEST_INT_RESULT" = "success" || exit 1
          fi
          if [ "$E2E" = "true" ]; then
            test "$BUILD_RESULT" = "success" || exit 1
            test "$E2E_RESULT" = "success" || exit 1
          fi
          if [ "$DOCKER" = "true" ]; then
            test "$DOCKER_RESULT" = "success" || exit 1
          fi
