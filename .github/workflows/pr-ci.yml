# PR CI — ADR-003 + PROMPT-PIPELINE PR A.
# Roda em ubuntu-latest (não compete com produção na VPS). Sem secrets de produção.
name: pr-ci

on:
  pull_request:
    branches: [master, main]

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: "22"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!PROGRESS.md'
              - '!.github/ISSUE_TEMPLATE/**'

  risk-tier:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classificar trilho
        id: tier
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_REF: ${{ github.sha }}
        run: |
          node scripts/ci/risk-tier.mjs --json | tee risk.json
          tier=$(node -e "console.log(JSON.parse(require('fs').readFileSync('risk.json','utf8')).tier)")
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "Trilho: $tier"
      - uses: actions/upload-artifact@v4
        with:
          name: risk-tier
          path: risk.json

  migration-guard:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand/contract — block DROP/RENAME after production baseline
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          MIGRATION_EXPAND_BASELINE: "20261015250000"
        run: bash infra/scripts/check-migration-expand.sh
      - name: Traefik HostRegexp
        run: node infra/scripts/check-traefik-hostregexp.mjs

  gitleaks:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --verbose --redact \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"

  lint:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - name: API lint
        working-directory: api
        run: |
          npm ci
          npm run lint
          npm run lint:money
      - name: Web lint + format
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run format:check

  test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - name: API unit
        working-directory: api
        run: |
          npm ci
          npx prisma generate
          npm test
      - name: Chrome for Karma
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Web unit
        working-directory: web
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm ci
          npm test -- --watch=false --browsers=ChromeHeadlessCI

  test-int:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Integration (Testcontainers Postgres)
        working-directory: api
        run: |
          npm ci
          npx prisma generate
          npm run test:int

  build:
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - name: Build API
        working-directory: api
        run: |
          npm ci
          npx prisma generate
          npm run build
      - name: Build Web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Bundle budget
        run: node scripts/ci/bundle-budget.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/web/browser
          retention-days: 3

  docker-build:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: api
            context: api
            file: api/Dockerfile
          - app: web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: se-pr-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=pr-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.app }}
      - name: Smoke API image
        if: matrix.app == 'api'
        run: |
          set -euo pipefail
          img="se-pr-api:${{ github.sha }}"
          docker run --rm --entrypoint sh "$img" -c 'test -f /app/dist/main.js && test -f /app/dist-seed/seed-showcase.js'
          # Carrega o bundle (entrypoint exige secrets). timeout=processo ficou de pé; ≠0=falhou bootstrap após load.
          set +e
          timeout 20s docker run --rm --entrypoint node "$img" -e "require('/app/dist/main.js')"
          code=$?
          set -e
          echo "smoke api exit=$code"
          # 125–127 = docker não rodou a imagem
          if [ "$code" -eq 125 ] || [ "$code" -eq 126 ] || [ "$code" -eq 127 ]; then
            exit 1
          fi
      - name: Smoke Web image
        if: matrix.app == 'web'
        run: |
          set -euo pipefail
          img="se-pr-web:${{ github.sha }}"
          docker run --rm --entrypoint sh "$img" -c 'test -f /app/dist/web/server/server.mjs'

  e2e:
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pr-e2e-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - name: Dev auth secrets (ephemeral, not production)
        run: |
          cp .env.local.example .env.local
          node scripts/dev-auth.mjs init
      - name: Compose Postgres + GoTrue + Mailpit
        run: |
          docker compose -f docker-compose.dev.yml --env-file .env.local down -v || true
          docker compose -f docker-compose.dev.yml --env-file .env.local up -d
          for i in $(seq 1 60); do
            docker compose -f docker-compose.dev.yml --env-file .env.local exec -T postgres pg_isready -U postgres -d sejaengajado && break
            sleep 2
          done
      - name: API migrate + seed + start
        working-directory: api
        env:
          DATABASE_URL: postgresql://postgres:local-dev-only@127.0.0.1:5432/sejaengajado?schema=public
          ADMIN_DATABASE_URL: postgresql://postgres:local-dev-only@127.0.0.1:5432/sejaengajado?schema=public
          ALLOW_DEMO_SEED: "1"
          PORT: "3000"
          NODE_ENV: development
        run: |
          set -a
          # shellcheck disable=SC1091
          . ../.env.local
          set +a
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          npm run seed:demo || true
          npm run seed:showcase || node dist-seed/seed-showcase.js || true
          export SUPABASE_JWT_SECRET_FILE="${SUPABASE_JWT_SECRET_FILE:-}"
          if [ -z "$SUPABASE_JWT_SECRET_FILE" ] && [ -n "${SUPABASE_JWT_SECRET:-}" ]; then
            mkdir -p ../.local/dev-secrets
            printf '%s' "$SUPABASE_JWT_SECRET" > ../.local/dev-secrets/jwt
            export SUPABASE_JWT_SECRET_FILE="$PWD/../.local/dev-secrets/jwt"
          fi
          nohup env \
            DATABASE_URL="$DATABASE_URL" \
            ADMIN_DATABASE_URL="$ADMIN_DATABASE_URL" \
            SUPABASE_URL="${SUPABASE_URL:-http://localhost:9999}" \
            SUPABASE_JWT_SECRET_FILE="$SUPABASE_JWT_SECRET_FILE" \
            ASAAS_BASE_URL="${ASAAS_BASE_URL:-https://sandbox.asaas.com/api/v3}" \
            node dist/main.js > /tmp/se-api-e2e.log 2>&1 &
          echo $! > /tmp/se-api-e2e.pid
          for i in $(seq 1 60); do
            curl -fsS "http://127.0.0.1:3000/api/health/ready" && break
            sleep 2
          done
          curl -fsS "http://127.0.0.1:3000/api/health/ready"
      - name: Web SSR + Playwright
        working-directory: web
        env:
          PORT: "4000"
          API_INTERNAL_URL: http://127.0.0.1:3000
          API_PUBLIC_URL: /api
        run: |
          npm ci
          npm run build
          npx playwright install chromium --with-deps
          nohup env PORT=4000 API_INTERNAL_URL=http://127.0.0.1:3000 npm run serve:ssr:web > /tmp/se-web-e2e.log 2>&1 &
          echo $! > /tmp/se-web-e2e.pid
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null "http://127.0.0.1:4000/" && break
            sleep 2
          done
          E2E_HAPPY_PATH=1 \
          E2E_BASE_URL=http://127.0.0.1:4000 \
          E2E_APEX=http://127.0.0.1:4000 \
          E2E_APP_BASE=http://127.0.0.1:4000 \
          E2E_API_BASE=http://127.0.0.1:3000 \
          npm run e2e:fluxo-feliz
      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/se-api-e2e.pid ]; then kill "$(cat /tmp/se-api-e2e.pid)" || true; fi
          if [ -f /tmp/se-web-e2e.pid ]; then kill "$(cat /tmp/se-web-e2e.pid)" || true; fi
          docker compose -f docker-compose.dev.yml --env-file .env.local down -v || true
          tail -n 80 /tmp/se-api-e2e.log || true
          tail -n 80 /tmp/se-web-e2e.log || true

  pr-ci-ok:
    if: always()
    needs:
      [
        changes,
        risk-tier,
        migration-guard,
        gitleaks,
        lint,
        test,
        test-int,
        build,
        docker-build,
        e2e,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        run: |
          code="${{ needs.changes.outputs.code }}"
          echo "code=$code"
          echo "risk=${{ needs.risk-tier.result }}"
          echo "migration=${{ needs.migration-guard.result }}"
          echo "gitleaks=${{ needs.gitleaks.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "test-int=${{ needs.test-int.result }}"
          echo "build=${{ needs.build.result }}"
          echo "docker-build=${{ needs.docker-build.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          if [ "$code" != "true" ]; then
            echo "docs-only / paths-filter: pr-ci-ok"
            test "${{ needs.changes.result }}" = "success"
            exit 0
          fi
          for r in \
            ${{ needs.risk-tier.result }} \
            ${{ needs.migration-guard.result }} \
            ${{ needs.gitleaks.result }} \
            ${{ needs.lint.result }} \
            ${{ needs.test.result }} \
            ${{ needs.test-int.result }} \
            ${{ needs.build.result }} \
            ${{ needs.docker-build.result }} \
            ${{ needs.e2e.result }}; do
            test "$r" = "success" || exit 1
          done
