name: "🧱 Core (fluxo principal / MVP)"
description: "Algo necessário para o fluxo feliz / MVP funcionar."
title: "[core] área: resumo"
labels: ["type: core", "status: triagem"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      description: "Qual parte do fluxo principal falta ou quebra."
    validations:
      required: true
  - type: textarea
    id: aceite
    attributes:
      label: "Critérios de aceite (Dado/Quando/Então)"
      description: |
        Formato obrigatório, um cenário por bloco:
        Dado … / Quando … / Então …
        Inclua o teste que prova (unit/int/e2e) quando souber.
      placeholder: |
        Dado um admin autenticado com MFA
        Quando ele publica um site DRAFT
        Então o subdomínio responde 200 com o nome do negócio
    validations:
      required: true
  - type: dropdown
    id: papel
    attributes:
      label: "Papel afetado (admin/revendedor/cliente/público)"
      multiple: true
      options: [admin, revendedor, cliente, público]
    validations:
      required: true
  - type: textarea
    id: fora
    attributes:
      label: "Fora do escopo"
      description: "O que explicitamente NÃO entra neste trabalho."
      placeholder: "Ex.: impersonar, cupom no checkout, deploy manual…"
    validations:
      required: true
  - type: dropdown
    id: decisao
    attributes:
      label: "Decisão de negócio em aberto? (sim/não)"
      options: ["não", "sim"]
    validations:
      required: true
  - type: dropdown
    id: impacto
    attributes:
      label: Impacto (severidade × alcance → prioridade, ver TRIAGEM.md)
      options:
        - "P0 — bloqueia fluxo feliz / produção / segurança / dinheiro"
        - "P1 — atrapalha fluxo feliz, tem contorno"
        - "P2 — importante, não bloqueia"
        - "P3 — polimento"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      multiple: true
      options: [web, api, infra, biosite, painel, revenda, pagamentos, ux]
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto (commit, PR, logs, prints)
      description: "Sem segredos, tokens ou dados pessoais reais."
