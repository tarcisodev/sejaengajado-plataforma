name: "🐞 Bug"
description: "Algo que funcionava ou deveria funcionar e não funciona."
title: "[bug] área: resumo"
labels: ["type: bug", "status: triagem"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      description: "O que acontece × o que deveria acontecer."
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: "Passos para reproduzir"
      description: "1. … 2. … 3. … Resultado esperado: …"
    validations:
      required: true
  - type: dropdown
    id: impacto
    attributes:
      label: Impacto (severidade × alcance → prioridade, ver TRIAGEM.md)
      options:
        - "P0 — bloqueia fluxo feliz / produção / segurança / dinheiro"
        - "P1 — atrapalha fluxo feliz, tem contorno"
        - "P2 — importante, não bloqueia"
        - "P3 — polimento"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      multiple: true
      options: [web, api, infra, biosite, painel, revenda, pagamentos, ux]
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto (commit, PR, logs, prints)
      description: "Sem segredos, tokens ou dados pessoais reais."
