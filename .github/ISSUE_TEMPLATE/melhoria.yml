name: "✨ Melhoria"
description: "Ideia, ajuste ou nova capacidade que não é necessária para o fluxo principal."
title: "[melhoria] área: resumo"
labels: ["type: melhoria", "status: triagem"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      description: "Problema ou oportunidade e a proposta."
    validations:
      required: true
  - type: textarea
    id: aceite
    attributes:
      label: "Critérios de aceite (Dado/Quando/Então)"
      description: |
        Formato obrigatório:
        Dado … / Quando … / Então …
      placeholder: |
        Dado …
        Quando …
        Então …
    validations:
      required: true
  - type: dropdown
    id: papel
    attributes:
      label: "Papel afetado (admin/revendedor/cliente/público)"
      multiple: true
      options: [admin, revendedor, cliente, público]
    validations:
      required: true
  - type: textarea
    id: fora
    attributes:
      label: "Fora do escopo"
      description: "O que explicitamente NÃO entra neste trabalho."
    validations:
      required: true
  - type: dropdown
    id: decisao
    attributes:
      label: "Decisão de negócio em aberto? (sim/não)"
      options: ["não", "sim"]
    validations:
      required: true
  - type: dropdown
    id: impacto
    attributes:
      label: Impacto (severidade × alcance → prioridade, ver TRIAGEM.md)
      options:
        - "P0 — bloqueia fluxo feliz / produção / segurança / dinheiro"
        - "P1 — atrapalha fluxo feliz, tem contorno"
        - "P2 — importante, não bloqueia"
        - "P3 — polimento"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      multiple: true
      options: [web, api, infra, biosite, painel, revenda, pagamentos, ux]
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto (commit, PR, logs, prints)
      description: "Sem segredos, tokens ou dados pessoais reais."
