@if (view$ | async; as view) {
  <div [attr.data-tenant-view]="view.kind">
    @switch (view.kind) {
      @case ('landing') {
        <app-landing-page />
      }
      @case ('app') {
        <app-platform-home />
      }
      @case ('site') {
        <app-site-page [site]="view.site" />
      }
      @case ('suspended') {
        <app-site-notice [view]="view" />
      }
      @case ('archived') {
        <app-site-notice [view]="view" />
      }
      @case ('not-found') {
        <app-site-notice [view]="view" />
      }
    }
  </div>
}
