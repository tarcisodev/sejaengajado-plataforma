<a
  class="sr-only focus:not-sr-only focus:absolute focus:start-4 focus:top-4 focus:z-10 focus:rounded-lg focus:bg-background focus:px-3 focus:py-2 focus:text-sm focus:ring-3 focus:ring-ring"
  href="#conteudo"
>
  Ir para o conteúdo
</a>
<div class="min-h-dvh bg-background text-foreground">
  <header class="flex items-center gap-4 border-b border-border px-4 py-3 md:px-8">
    <p class="font-display text-sm text-primary">Seja Engajado</p>
    <p class="text-sm text-muted-foreground">Revenda</p>
    <div class="ms-auto flex items-center gap-2">
      <button
        hlmBtn
        type="button"
        variant="ghost"
        size="icon"
        class="size-11"
        (click)="theme.toggle()"
        [attr.aria-pressed]="theme.theme() === 'dark'"
        aria-label="Tema"
      >
        <ng-icon [name]="theme.theme() === 'dark' ? 'lucideSun' : 'lucideMoon'" />
      </button>
      <button hlmBtn type="button" variant="outline" class="h-11" (click)="leave()">Sair</button>
    </div>
  </header>
  <main id="conteudo" class="mx-auto max-w-6xl px-4 py-6 md:px-8">
    <h1 class="font-display text-2xl md:text-3xl">Área do revendedor</h1>
    <p class="mt-2 text-sm text-muted-foreground">
      Painel em construção (AUTH-WEB parte 2 apontará as rotas da API).
    </p>
    <router-outlet />
  </main>
</div>
<hlm-toaster />
