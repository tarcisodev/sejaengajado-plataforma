<div class="grid gap-4">
  <label class="grid max-w-md gap-2 text-sm">
    Buscar cliente
    <span class="relative">
      <ng-icon
        class="pointer-events-none absolute start-3 top-1/2 size-4 -translate-y-1/2 text-muted-foreground"
        name="lucideSearch"
      />
      <input
        hlmInput
        class="h-11 ps-10"
        [value]="query()"
        (input)="query.set(inputValue($event))"
      />
    </span>
  </label>
  <section hlmCard class="min-w-0">
    <div hlmTableContainer>
      <table hlmTable>
        <caption hlmCaption>
          Clientes
        </caption>
        <thead hlmTHead>
          <tr hlmTr>
            <th hlmTh scope="col">Nome</th>
            <th hlmTh scope="col">WhatsApp</th>
            <th hlmTh scope="col">Cidade</th>
            <th hlmTh scope="col">Revendedor</th>
          </tr>
        </thead>
        <tbody hlmTBody>
          @if (!ready()) {
            @for (row of placeholders; track row) {
              <tr hlmTr>
                <td hlmTd colspan="4"><div hlmSkeleton class="h-8 w-full"></div></td>
              </tr>
            }
          } @else if (visible().length === 0) {
            <tr hlmTr>
              <td hlmTd colspan="4">Nenhum resultado</td>
            </tr>
          } @else {
            @for (row of visible(); track row.id) {
              <tr hlmTr>
                <td hlmTd>{{ row.nome }}</td>
                <td hlmTd class="tabular-nums">{{ row.whatsapp }}</td>
                <td hlmTd>{{ row.cidade }}</td>
                <td hlmTd>{{ resellerName(row.resellerId) }}</td>
              </tr>
            }
          }
        </tbody>
      </table>
    </div>
  </section>
</div>
