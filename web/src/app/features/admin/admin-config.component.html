@if (config(); as config) {
  <form (submit)="save($event)">
    <label
      >Aviso a partir do dia
      <input name="notifyFromDias" type="number" [value]="config.notifyFromDias"
    /></label>
    <label
      >Só leitura a partir do dia
      <input name="readOnlyDias" type="number" [value]="config.readOnlyDias"
    /></label>
    <label
      >Suspensão a partir do dia
      <input name="suspendDias" type="number" [value]="config.suspendDias"
    /></label>
    <label
      >Arquivo a partir do dia <input name="archiveDias" type="number" [value]="config.archiveDias"
    /></label>
    <label>
      Renovação anual do Pronto (centavos)
      <input name="prontoRenewalCentavos" type="number" [value]="config.prontoRenewalCentavos" />
    </label>
    <label>
      Valor da placa (centavos)
      <input name="plaqueValueCentavos" type="number" [value]="config.plaqueValueCentavos" />
    </label>
    <label>
      Multa da placa (%)
      <input name="plaquePenaltyPct" type="number" [value]="config.plaquePenaltyPct" />
    </label>
    <label>
      Dias de graça do revendedor
      <input name="resellerGraceDays" type="number" [value]="config.resellerGraceDays" />
    </label>
    <button type="submit">Salvar configurações</button>
  </form>
}
@if (saved()) {
  <p class="note">Configurações gravadas.</p>
}
