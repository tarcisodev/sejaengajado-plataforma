<section class="grid gap-6" data-site-editor>
  <div hlmCard class="p-4 md:p-6">
    <h2 class="font-display text-xl">Editor do site</h2>
    <p class="mt-1 text-sm text-muted-foreground">
      {{ site().slug }}.sejaengajado.com.br · {{ site().status }}
    </p>

    <div class="mt-6 grid gap-4 md:grid-cols-2">
      <label class="grid gap-2 text-sm">
        Nome do negócio
        <input
          hlmInput
          class="h-11"
          name="businessName"
          data-field="businessName"
          [value]="businessName()"
          (input)="businessName.set($any($event.target).value)"
        />
      </label>
      <label class="grid gap-2 text-sm">
        WhatsApp
        <input
          hlmInput
          class="h-11"
          name="whatsapp"
          data-field="whatsapp"
          [value]="whatsapp()"
          (input)="whatsapp.set($any($event.target).value)"
        />
      </label>
      <label class="grid gap-2 text-sm">
        Telefone
        <input
          hlmInput
          class="h-11"
          name="phone"
          data-field="phone"
          [value]="phone()"
          (input)="phone.set($any($event.target).value)"
        />
      </label>
      <label class="grid gap-2 text-sm md:col-span-2">
        Descrição
        <textarea
          hlmInput
          class="min-h-24 py-2"
          name="description"
          data-field="description"
          [value]="description()"
          (input)="description.set($any($event.target).value)"
        ></textarea>
      </label>
      <label class="grid gap-2 text-sm md:col-span-2">
        URL da imagem (logo ou capa)
        <input
          hlmInput
          class="h-11"
          name="logoUrl"
          data-field="logoUrl"
          placeholder="https://…"
          [value]="logoUrl()"
          (input)="logoUrl.set($any($event.target).value)"
        />
      </label>
    </div>

    @if (notice()) {
      <p class="mt-3 text-sm text-muted-foreground" role="status">{{ notice() }}</p>
    }

    <div class="mt-6 flex flex-wrap gap-2">
      <button
        hlmBtn
        type="button"
        class="h-11"
        data-action="save"
        [disabled]="busy()"
        (click)="save()"
        aria-label="Salvar alterações"
      >
        <ng-icon name="lucideSave" />
        Salvar
      </button>

      @if (canPublish()) {
        <app-confirm-action
          title="Publicar site"
          [effect]="'O site fica no ar em ' + site().slug + '.sejaengajado.com.br'"
          verb="Publicar"
          undoHint="Você pode despublicar depois."
          action="publish"
          ariaLabel="Publicar site"
          [disabled]="busy()"
          (confirm)="published.emit()"
        >
          <ng-icon name="lucideEye" />
        </app-confirm-action>
      }

      @if (canUnpublish()) {
        <app-confirm-action
          title="Despublicar site"
          [effect]="'O site sai do ar em ' + site().slug + '.sejaengajado.com.br'"
          verb="Despublicar"
          undoHint="O conteúdo permanece; você pode publicar de novo."
          action="unpublish"
          ariaLabel="Despublicar site"
          triggerVariant="outline"
          [disabled]="busy()"
          (confirm)="unpublished.emit()"
        >
          <ng-icon name="lucideEyeOff" />
        </app-confirm-action>
      }

      @if (canArchive()) {
        <app-confirm-action
          title="Arquivar site"
          [effect]="'O endereço ' + site().slug + '.sejaengajado.com.br deixa de responder.'"
          verb="Arquivar"
          undoHint="Não dá para desfazer pelo painel sem suporte."
          action="archive"
          ariaLabel="Arquivar site"
          triggerVariant="destructive"
          [destructive]="true"
          [disabled]="busy()"
          (confirm)="archived.emit()"
        >
          <ng-icon name="lucideArchive" />
        </app-confirm-action>
      }
    </div>
  </div>
</section>
